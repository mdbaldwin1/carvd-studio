name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: # Reused by release so validation gates publication
  workflow_dispatch: # Allows manual triggering

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup test license key
        run: echo "${{ secrets.LICENSE_PRIVATE_KEY }}" > license-private-key.pem
        working-directory: packages/desktop

      - name: Run unit tests
        run: npm run test:unit --workspace=@carvd/desktop
        env:
          NODE_ENV: "test"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/desktop/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  e2e-tests:
    # Keep the protected check names stable while pinning the Linux runner.
    name: E2E Tests (${{ matrix.os == 'ubuntu-24.04' && 'ubuntu-latest' || matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing Playwright system deps (attempt ${attempt}/3)"
            if timeout 300 npx playwright install-deps; then
              echo "Playwright system dependencies installed"
              exit 0
            fi
            echo "::warning::Playwright system dependency install attempt ${attempt} timed out or failed"
            sleep 15
          done
          echo "::warning::Proceeding without explicit install-deps after retries; tests will validate runtime readiness"
        working-directory: packages/desktop

      - name: Setup test license key
        run: echo "${{ secrets.LICENSE_PRIVATE_KEY }}" > license-private-key.pem
        working-directory: packages/desktop

      - name: Build desktop app
        run: npm run build:desktop

      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e --workspace=@carvd/desktop
        env:
          CI: true
          NODE_ENV: "test"

      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e --workspace=@carvd/desktop
        env:
          CI: true
          NODE_ENV: "test"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: packages/desktop/playwright-report/
          retention-days: 7

  linux-package:
    name: Linux Package Smoke Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup test license key
        run: echo "${{ secrets.LICENSE_PRIVATE_KEY }}" > license-private-key.pem
        working-directory: packages/desktop

      - name: Build desktop app
        run: npm run build --workspace=@carvd/desktop

      # Package the dependencies installed by npm ci; do not resolve a second, unlocked tree.
      - name: Package and verify Linux artifacts
        working-directory: packages/desktop
        run: |
          npx --no-install electron-builder --linux AppImage deb --x64 --publish never

          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE="dist/Carvd.Studio-${VERSION}-x86_64.AppImage"
          DEB="dist/Carvd.Studio-${VERSION}-amd64.deb"

          test -x "$APPIMAGE"
          test "$(stat -c%s "$APPIMAGE")" -gt 1000000
          file "$APPIMAGE" | grep -q "ELF 64-bit.*x86-64"

          test "$(stat -c%s "$DEB")" -gt 1000000
          dpkg-deb --info "$DEB" > /dev/null
          grep -q "$(basename "$APPIMAGE")" dist/latest-linux.yml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (desktop)
        run: npm run lint --workspace=@carvd/desktop

      - name: Run TypeScript type check (desktop)
        run: npm run typecheck --workspace=@carvd/desktop

      - name: Check formatting (desktop)
        run: npm run format:check --workspace=@carvd/desktop

      - name: Run ESLint (website)
        run: npm run lint --workspace=@carvd/website

      - name: Run TypeScript type check (website)
        run: npm run typecheck --workspace=@carvd/website

      - name: Check formatting (website)
        run: npm run format:check --workspace=@carvd/website

  website-tests:
    name: Website Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run website unit tests
        run: npm run test:run --workspace=@carvd/website
        env:
          NODE_ENV: "test"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/website/coverage/lcov.info
          flags: website
          fail_ci_if_error: false

  website-e2e:
    name: Website E2E Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/website

      - name: Build website
        run: npm run build --workspace=@carvd/website

      - name: Run E2E tests
        run: npm run test:e2e --workspace=@carvd/website -- --project=chromium
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-playwright-report
          path: packages/website/playwright-report/
          retention-days: 7

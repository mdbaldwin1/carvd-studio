name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    name: Required Release Validation
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release-credentials:
    name: Verify Release Credentials
    runs-on: ubuntu-24.04
    steps:
      - name: Require signing and notarization credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID LICENSE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release credential: $name"
              missing=1
            fi
          done
          exit "$missing"

  # ── Step 1: Determine version and create git tag ────────────────────────────
  prepare:
    name: Prepare Release
    needs: [validate, release-credentials]
    # Skip version-bump commits to prevent infinite loops
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION (tag: $TAG)"

      - name: Check if version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Compare against the latest GitHub Release instead of HEAD~1
          # This is squash-merge safe since releases are durable artifacts
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          LATEST_VERSION="${LATEST_TAG#v}"

          echo "Current version: $VERSION"
          echo "Latest release: ${LATEST_TAG:-<none>} (version: ${LATEST_VERSION:-<none>})"

          if [ -z "$LATEST_VERSION" ]; then
            echo "✅ No existing releases found - proceeding with first release $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "⏭️  Version $VERSION matches latest release - skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
          elif gh release view "$TAG" &>/dev/null; then
            echo "⚠️  Release $TAG already exists - skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ New version $TAG (latest release: v$LATEST_VERSION) - proceeding with release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Create git tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag if it doesn't already exist (idempotent)
          if git rev-parse "$TAG" &>/dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Existing tag $TAG does not match the validated release commit"
              exit 1
            fi
            echo "Tag $TAG already exists at the validated commit - reusing"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  # ── Step 2: Build and package for each platform ─────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-24.04
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup license key
        run: echo "${{ secrets.LICENSE_PRIVATE_KEY }}" > license-private-key.pem
        working-directory: packages/desktop

      - name: Build desktop app
        env:
          MAIN_VITE_POSTHOG_KEY: ${{ vars.MAIN_VITE_POSTHOG_KEY }}
          MAIN_VITE_POSTHOG_HOST: ${{ vars.MAIN_VITE_POSTHOG_HOST }}
        run: npm run build --workspace=@carvd/desktop

      - name: Import Apple certificate (macOS only)
        if: matrix.platform == 'mac'
        id: keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CSC_LINK" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign

          # Install Apple Developer ID intermediate certificates (required for valid chain)
          curl -sL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o DeveloperIDG2CA.cer
          curl -sL https://www.apple.com/certificateauthority/DeveloperIDCA.cer -o DeveloperIDCA.cer
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH"
          security import DeveloperIDCA.cer -k "$KEYCHAIN_PATH"
          rm DeveloperIDG2CA.cer DeveloperIDCA.cer

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

          # Output keychain path for the packaging step
          echo "path=$KEYCHAIN_PATH" >> $GITHUB_OUTPUT

      # Package the dependencies installed by npm ci; do not resolve a second, unlocked tree.
      - name: Package app (macOS)
        if: matrix.platform == 'mac'
        env:
          # Fail closed if notarization cannot run for a release build.
          CARVD_REQUIRE_NOTARIZATION: "true"
          # Notarization env vars (used by scripts/notarize.cjs afterSign hook)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: ${{ steps.keychain.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/desktop
        run: npx --no-install electron-builder --mac --arm64 --x64 --publish never --config.forceCodeSigning=true

      - name: Package app (Windows)
        if: matrix.platform == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/desktop
        run: npx --no-install electron-builder --win --publish never

      - name: Package app (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/desktop
        run: npx --no-install electron-builder --linux AppImage deb --x64 --publish never

      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: packages/desktop
        run: |
          APPIMAGE="dist/Carvd.Studio-${{ needs.prepare.outputs.version }}-x86_64.AppImage"
          DEB="dist/Carvd.Studio-${{ needs.prepare.outputs.version }}-amd64.deb"

          test -x "$APPIMAGE"
          test "$(stat -c%s "$APPIMAGE")" -gt 1000000
          file "$APPIMAGE" | grep -q "ELF 64-bit.*x86-64"

          # A Debian staging directory can leave this marker behind when
          # repackaged. It makes electron-updater select DebUpdater in an AppImage.
          APPIMAGE_CHECK_DIR="$(mktemp -d)"
          APPIMAGE_ABSOLUTE="$(realpath "$APPIMAGE")"
          (cd "$APPIMAGE_CHECK_DIR" && "$APPIMAGE_ABSOLUTE" --appimage-extract > /dev/null)
          test -f "$APPIMAGE_CHECK_DIR/squashfs-root/resources/app-update.yml"
          test ! -e "$APPIMAGE_CHECK_DIR/squashfs-root/resources/package-type"
          rm -rf "$APPIMAGE_CHECK_DIR"

          test "$(stat -c%s "$DEB")" -gt 1000000
          dpkg-deb --info "$DEB" > /dev/null
          grep -q "Carvd.Studio-${{ needs.prepare.outputs.version }}-x86_64.AppImage" dist/latest-linux.yml

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/latest-mac.yml
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.exe.blockmap
            packages/desktop/dist/latest.yml
          retention-days: 7

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/latest-linux.yml
          retention-days: 7

  # ── Step 3: Create GitHub Release with artifacts ────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: dist/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: dist/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: dist/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Carvd Studio ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/mac/*.dmg
            dist/mac/*.zip
            dist/mac/latest-mac.yml
            dist/win/*.exe
            dist/win/*.exe.blockmap
            dist/win/latest.yml
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 4: Bump patch version on develop for next release ──────────────────
  # Branches from main (which has the just-released version) so the bump
  # doesn't depend on develop being synced first. The sync-develop.yml
  # workflow handles syncing main back to develop separately via PR.
  bump-develop:
    name: Bump Version on Develop
    needs: [prepare, create-release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Compute next patch version
        id: next
        run: |
          CURRENT="${{ needs.prepare.outputs.version }}"
          IFS='.' read -ra PARTS <<< "$CURRENT"
          NEXT="${PARTS[0]}.${PARTS[1]}.$((PARTS[2] + 1))"
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "📦 Next development version: $NEXT"

      - name: Create version bump branch and PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          NEXT="${{ steps.next.outputs.version }}"
          BRANCH="chore/bump-version-to-${NEXT}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          # Update version in desktop package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf-8'));
            pkg.version = '${NEXT}';
            fs.writeFileSync('packages/desktop/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git add packages/desktop/package.json
          git commit -m "chore(release): bump version to ${NEXT} for next development cycle"

          git push origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: bump version to ${NEXT}" \
            --body "Automated version bump after release of v${{ needs.prepare.outputs.version }}. Merge when ready to start the next development cycle."

  # ── Summary ─────────────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    needs: [prepare, build, create-release, bump-develop]
    if: always() && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Print summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | **${{ needs.prepare.outputs.tag }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Develop Bump | ${{ needs.bump-develop.result }} |" >> $GITHUB_STEP_SUMMARY
